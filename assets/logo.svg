<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradientV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradientV" x1="0%" y1="0%" x2="100%" y2="0%">
       <stop offset="0%" style="stop-color:#2b6cb0;stop-opacity:1" />
       <stop offset="100%" style="stop-color:#2c5282;stop-opacity:1" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&amp;display=swap');
      .text-main { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 24px; }
      .text-sub { font-family: 'Outfit', sans-serif; font-weight: 400; font-size: 13px; }
      .icon-text { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 32px; }
    </style>
  </defs>
  <!-- Icon Centered -->
  <rect x="60" y="20" width="80" height="80" rx="20" fill="url(#iconGradientV)" />
  <text x="100" y="73" fill="white" text-anchor="middle" class="icon-text">CS</text>
  <!-- Text Centered -->
  <text x="100" y="130" fill="url(#textGradientV)" text-anchor="middle" class="text-main">CLEANSERVICE</text>
  <text x="100" y="150" fill="#64748b" text-anchor="middle" class="text-sub">FACILITY MANAGEMENT</text>
</svg>
