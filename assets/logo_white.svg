<svg width="260" height="100" viewBox="0 0 260 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&amp;display=swap');
      .text-main { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 24px; }
      .text-sub { font-family: 'Outfit', sans-serif; font-weight: 400; font-size: 13px; }
      .icon-text { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 20px; }
    </style>
  </defs>
  <!-- Background -->
  <rect x="0" y="0" width="260" height="100" rx="12" fill="url(#bgGradient)" />
  
  <!-- Icon (White on Blue) -->
  <rect x="20" y="25" width="50" height="50" rx="12" fill="white" fill-opacity="0.2" />
  <text x="45" y="58" fill="white" text-anchor="middle" class="icon-text">CS</text>

  <!-- Text -->
  <text x="85" y="50" fill="white" class="text-main">CLEANSERVICE</text>
  <text x="86" y="68" fill="white" fill-opacity="0.9" class="text-sub">FACILITY MANAGEMENT</text>
</svg>
